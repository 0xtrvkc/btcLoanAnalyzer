name: Export daily position report

# Your position comes from the POSITION_JSON repository secret and the report is uploaded as a
# private workflow artifact (visible only to people with access to this repo's Actions).
# Nothing about your position is committed to the repository.

on:
  schedule:
    - cron: '00 1 * * *'   # 01:00 UTC, after the daily market export
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: export-position
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      POSITION_JSON: ${{ secrets.POSITION_JSON }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check calculation regressions
        run: npm test

      - name: Run export
        if: ${{ env.POSITION_JSON != '' }}
        run: node scripts/export-position.js

      - name: Skip (no POSITION_JSON secret)
        if: ${{ env.POSITION_JSON == '' }}
        run: echo "Add a POSITION_JSON repository secret to enable the daily report."

      - name: Upload report
        if: ${{ env.POSITION_JSON != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: position-analysis
          path: data/position-analysis.txt
          retention-days: 14
