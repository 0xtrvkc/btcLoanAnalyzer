name: Export daily position snapshot

on:
  schedule:
    # Once a day, 06:17 UTC. Off the top of the hour on purpose (less queueing
    # on GitHub's shared runners). Adjust the hour if you want it to line up
    # with your daily price/MVRV export instead.
    - cron: '17 6 * * *'
  workflow_dispatch: {} # lets you run it on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: export-position
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run export script
        run: node scripts/export-position.js

      - name: Commit updated snapshot (only if it changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/position-analysis.txt
          if git diff --cached --quiet; then
            echo "No change in analysis output — nothing to commit."
            exit 0
          fi
          git commit -m "chore: daily position snapshot [skip ci]"
          git push
